name: Build Sift Weapons

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          echo "=== Project files ==="
          find . -type f | head -50
          echo "=== gradle.properties ==="
          cat gradle.properties
          echo "=== build.gradle ==="
          cat build.gradle
          echo "=== Starting build ==="
          gradle build --no-daemon --stacktrace --info 2>&1 | tee build.log
          echo "=== Build exit code: $? ==="
          ls -la build/libs/ || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: siftweapons-jar
          path: build/libs/*.jar
          if-no-files-found: warn
