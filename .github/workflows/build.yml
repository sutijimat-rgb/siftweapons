name: Build Sift Weapons

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build with Gradle
        run: |
          set -o pipefail
          echo "=== Starting build ==="
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          echo "### Build Log (last 150 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -150 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -la build/libs/ || true
          if [ $STATUS -ne 0 ] || ! ls build/libs/*.jar 1>/dev/null 2>&1; then
            echo "Build failed or no JAR"
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: siftweapons-jar
          path: build/libs/*.jar
          if-no-files-found: error
