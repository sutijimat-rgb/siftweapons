name: Build Sift Weapons

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        id: build
        run: |
          set -o pipefail
          echo "### Project files" >> $GITHUB_STEP_SUMMARY
          find . -type f | sort >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### gradle.properties" >> $GITHUB_STEP_SUMMARY
          cat gradle.properties >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Running gradle build..." >> $GITHUB_STEP_SUMMARY
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Gradle exit code: $BUILD_EXIT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Last 80 lines of build log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -80 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### build/ directory" >> $GITHUB_STEP_SUMMARY
          find build -type f 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No build dir" >> $GITHUB_STEP_SUMMARY
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error::Gradle build failed with exit code $BUILD_EXIT"
            exit $BUILD_EXIT
          fi
          if ! ls build/libs/*.jar 1>/dev/null 2>&1; then
            echo "::error::No JAR was produced in build/libs/"
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: siftweapons-jar
          path: build/libs/*.jar
          if-no-files-found: error
